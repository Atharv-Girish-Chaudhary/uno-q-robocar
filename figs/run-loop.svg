<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 380" width="600" height="475" role="img" aria-label="One pass of the loop: look at the newest picture, find the ball and goal, decide one move, move one short pulse, wait for a fresh picture, repeat. Any doubt stops the run.">
<title>One pass of the loop: look at the newest picture, find the ball and goal, decide one move, move one short pulse, wait for a fresh picture, repeat. Any doubt stops the run.</title>
<style>
svg { color: #17211b; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
.bg { fill: #ffffff; }
.d-box { fill: #ffffff; stroke: #566a5d; stroke-width: 1.25; }
.d-yours { fill: #e2efe5; stroke: #23743f; stroke-width: 1.5; }
.d-theirs { fill: #e3ebf7; stroke: #1d55a0; stroke-width: 1.5; }
.d-stop { fill: #f7e8df; stroke: #ad4316; stroke-width: 1.75; }
.d-model { fill: #f5ebcd; stroke: #7d5900; stroke-width: 1.5; }
.d-frame { fill: none; stroke: #566a5d; stroke-width: 1.25; stroke-dasharray: 5 4; }
.d-dash { stroke-dasharray: 6 4; }
.d-line { stroke: currentColor; stroke-width: 1.5; fill: none; }
.d-t { fill: currentColor; font-size: 13px; }
.d-m { fill: #566a5d; font-size: 12px; }
.d-s { font-size: 12.5px; }
.d-b { font-weight: 700; }
.d-i { font-style: italic; }
.d-mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 11.5px; }
.d-xs { font-size: 11.5px; }
.d-red { fill: #ad4316; }
.r-hi { fill: #23743f; }
.r-lo { fill: #d3ddd5; }
.r-sep { stroke: #ffffff; stroke-width: 2; }
.r-on-hi { fill: #ffffff; font-size: 15px; font-weight: 700; }
.r-on-lo { fill: #17211b; font-size: 15px; font-weight: 700; }
.r-br-hi { fill: none; stroke: #23743f; stroke-width: 1.5; }
.r-br-lo { fill: none; stroke: #566a5d; stroke-width: 1.5; }
@media (prefers-color-scheme: dark) {
  svg { color: #e3eae5; }
  .bg { fill: #161e19; }
  .d-box { fill: #161e19; stroke: #9aac9f; }
  .d-yours { fill: #173022; stroke: #62c58a; }
  .d-theirs { fill: #16253b; stroke: #7eaaf0; }
  .d-stop { fill: #3a2015; stroke: #f0925f; }
  .d-model { fill: #322810; stroke: #e8bd57; }
  .d-frame { stroke: #9aac9f; }
  .d-m { fill: #9aac9f; }
  .d-red { fill: #f0925f; }
  .r-hi { fill: #62c58a; }
  .r-lo { fill: #2b372f; }
  .r-sep { stroke: #161e19; }
  .r-on-hi { fill: #0b120e; }
  .r-on-lo { fill: #e3eae5; }
  .r-br-hi { stroke: #62c58a; }
  .r-br-lo { stroke: #9aac9f; }
}
</style>
<rect class="bg" x="0" y="0" width="480" height="380" rx="12"/>
        <defs><marker id="m-loop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs>
        <rect class="d-box" x="16" y="16" width="150" height="66" rx="8"/>
        <text class="d-t d-b" x="91" y="40" text-anchor="middle">1. Look</text>
        <text class="d-t d-s" x="91" y="58" text-anchor="middle">newest picture</text>
        <text class="d-m d-mono" x="91" y="74" text-anchor="middle">stream.py</text>
        <rect class="d-box" x="314" y="16" width="150" height="66" rx="8"/>
        <text class="d-t d-b" x="389" y="40" text-anchor="middle">2. Find</text>
        <text class="d-t d-s" x="389" y="58" text-anchor="middle">ball and goal</text>
        <text class="d-m d-mono" x="389" y="74" text-anchor="middle">detector.py</text>
        <rect class="d-box" x="314" y="216" width="150" height="66" rx="8"/>
        <text class="d-t d-b" x="389" y="240" text-anchor="middle">3. Decide</text>
        <text class="d-t d-s" x="389" y="258" text-anchor="middle">one move</text>
        <text class="d-m d-mono" x="389" y="274" text-anchor="middle">controller.py</text>
        <rect class="d-box" x="16" y="216" width="150" height="66" rx="8"/>
        <text class="d-t d-b" x="91" y="240" text-anchor="middle">4. Move</text>
        <text class="d-t d-s" x="91" y="258" text-anchor="middle">one short pulse</text>
        <text class="d-m d-mono" x="91" y="274" text-anchor="middle">robot.drive()</text>
        <rect class="d-stop" x="314" y="318" width="150" height="54" rx="8"/>
        <text class="d-t d-b d-red" x="389" y="341" text-anchor="middle">Stop the run</text>
        <text class="d-m" x="389" y="360" text-anchor="middle">lost ball, old video</text>
        <line class="d-line" x1="166" y1="49" x2="314" y2="49" marker-end="url(#m-loop)"/>
        <text class="d-m" x="240" y="41" text-anchor="middle">picture</text>
        <line class="d-line" x1="389" y1="82" x2="389" y2="216" marker-end="url(#m-loop)"/>
        <text class="d-m" x="381" y="153" text-anchor="end">where the ball is</text>
        <line class="d-line" x1="314" y1="249" x2="166" y2="249" marker-end="url(#m-loop)"/>
        <text class="d-m" x="240" y="241" text-anchor="middle">left, 148 ms</text>
        <line class="d-line" x1="91" y1="216" x2="91" y2="82" marker-end="url(#m-loop)"/>
        <text class="d-m" x="99" y="145">wait 120 ms</text>
        <text class="d-m" x="99" y="161">and 2 new frames</text>
        <line class="d-line" x1="389" y1="282" x2="389" y2="318" marker-end="url(#m-loop)"/>
        <text class="d-m" x="397" y="304">any doubt</text>
      </svg>
