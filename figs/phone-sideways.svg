<text class="d-m" x="240" y="52" text-anchor="middle">3024 × 4032</text>
<rect class="d-box" x="207" y="60" width="66" height="88" rx="3"/>
<circle class="d-line" cx="240" cy="104" r="12" fill="none"/>
<line class="d-line" x1="240" y1="152" x2="240" y2="173" marker-end="url(#m-ei)"/>
<text class="d-m d-s" x="240" y="190" text-anchor="middle">squashed to 96 × 96</text>
<rect class="d-box" x="204" y="198" width="72" height="72" rx="3"/>
<ellipse class="d-line" cx="240" cy="234" rx="12" ry="9" fill="none"/>
<text class="d-t d-b" x="240" y="292" text-anchor="middle">16 wide, 12 tall</text>
<text class="d-m" x="240" y="310" text-anchor="middle">the wrong shape</text>
<rect class="d-yours" x="326" y="10" width="136" height="310" rx="12"/>
<text class="d-t d-b" x="394" y="34" text-anchor="middle">Phone sideways</text>
<text class="d-m" x="394" y="52" text-anchor="middle">4032 × 3024</text>
<rect class="d-box" x="350" y="71" width="88" height="66" rx="3"/>
<circle class="d-line" cx="394" cy="104" r="12" fill="none"/>
<line class="d-line" x1="394" y1="152" x2="394" y2="173" marker-end="url(#m-ei)"/>
<text class="d-m d-s" x="394" y="190" text-anchor="middle">squashed to 96 × 96</text>
<rect class="d-box" x="358" y="198" width="72" height="72" rx="3"/>
<ellipse class="d-line" cx="394" cy="234" rx="9" ry="12" fill="none"/>
<text class="d-t d-b" x="394" y="292" text-anchor="middle">12 wide, 16 tall</text>
<text class="d-m" x="394" y="310" text-anchor="middle">the same shape</text>
</svg>
