<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 262" width="600" height="327.5" role="img" aria-label="The MCU, an STM32U585, is one chip holding its processor, its memory, its timers and the pins for motors and sensors, and it runs one program, the sketch. The MPU, a Qualcomm QRB2210, is a processor chip with separate RAM and storage chips, and it runs Linux and your Python.">
<title>The MCU, an STM32U585, is one chip holding its processor, its memory, its timers and the pins for motors and sensors, and it runs one program, the sketch. The MPU, a Qualcomm QRB2210, is a processor chip with separate RAM and storage chips, and it runs Linux and your Python.</title>
<style>
svg { color: #17211b; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
.bg { fill: #ffffff; }
.d-box { fill: #ffffff; stroke: #566a5d; stroke-width: 1.25; }
.d-yours { fill: #e2efe5; stroke: #23743f; stroke-width: 1.5; }
.d-theirs { fill: #e3ebf7; stroke: #1d55a0; stroke-width: 1.5; }
.d-stop { fill: #f7e8df; stroke: #ad4316; stroke-width: 1.75; }
.d-model { fill: #f5ebcd; stroke: #7d5900; stroke-width: 1.5; }
.d-frame { fill: none; stroke: #566a5d; stroke-width: 1.25; stroke-dasharray: 5 4; }
.d-dash { stroke-dasharray: 6 4; }
.d-line { stroke: currentColor; stroke-width: 1.5; fill: none; }
.d-t { fill: currentColor; font-size: 13px; }
.d-m { fill: #566a5d; font-size: 12px; }
.d-s { font-size: 12.5px; }
.d-b { font-weight: 700; }
.d-i { font-style: italic; }
.d-mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 11.5px; }
.d-xs { font-size: 11.5px; }
.d-red { fill: #ad4316; }
.r-hi { fill: #23743f; }
.r-lo { fill: #d3ddd5; }
.r-sep { stroke: #ffffff; stroke-width: 2; }
.r-on-hi { fill: #ffffff; font-size: 15px; font-weight: 700; }
.r-on-lo { fill: #17211b; font-size: 15px; font-weight: 700; }
.r-br-hi { fill: none; stroke: #23743f; stroke-width: 1.5; }
.r-br-lo { fill: none; stroke: #566a5d; stroke-width: 1.5; }
@media (prefers-color-scheme: dark) {
  svg { color: #e3eae5; }
  .bg { fill: #161e19; }
  .d-box { fill: #161e19; stroke: #9aac9f; }
  .d-yours { fill: #173022; stroke: #62c58a; }
  .d-theirs { fill: #16253b; stroke: #7eaaf0; }
  .d-stop { fill: #3a2015; stroke: #f0925f; }
  .d-model { fill: #322810; stroke: #e8bd57; }
  .d-frame { stroke: #9aac9f; }
  .d-m { fill: #9aac9f; }
  .d-red { fill: #f0925f; }
  .r-hi { fill: #62c58a; }
  .r-lo { fill: #2b372f; }
  .r-sep { stroke: #161e19; }
  .r-on-hi { fill: #0b120e; }
  .r-on-lo { fill: #e3eae5; }
  .r-br-hi { stroke: #62c58a; }
  .r-br-lo { stroke: #9aac9f; }
}
</style>
<rect class="bg" x="0" y="0" width="480" height="262" rx="12"/>
<rect class="d-theirs" x="16" y="12" width="212" height="240" rx="12"/>
<text class="d-t d-b" x="122" y="36" text-anchor="middle">MCU: STM32U585</text>
<text class="d-m" x="122" y="54" text-anchor="middle">one chip holds it all</text>
<rect class="d-box" x="32" y="70" width="180" height="34" rx="6"/>
<text class="d-t" x="122" y="92" text-anchor="middle">processor</text>
<rect class="d-box" x="32" y="112" width="180" height="34" rx="6"/>
<text class="d-t" x="122" y="134" text-anchor="middle">memory: RAM, flash</text>
<rect class="d-box" x="32" y="154" width="180" height="34" rx="6"/>
<text class="d-t" x="122" y="176" text-anchor="middle">timers</text>
<rect class="d-box" x="32" y="196" width="180" height="34" rx="6"/>
<text class="d-t" x="122" y="218" text-anchor="middle">motor and sensor pins</text>
<text class="d-m" x="122" y="246" text-anchor="middle">runs one program: the sketch</text>
<rect class="d-yours" x="252" y="12" width="212" height="118" rx="12"/>
<text class="d-t d-b" x="358" y="36" text-anchor="middle">MPU: QRB2210</text>
<text class="d-m" x="358" y="54" text-anchor="middle">the processor chip</text>
<rect class="d-box" x="268" y="70" width="180" height="34" rx="6"/>
<text class="d-t" x="358" y="92" text-anchor="middle">processor, 4 cores</text>
<text class="d-m" x="358" y="122" text-anchor="middle">runs Linux and your Python</text>
<line class="d-line" x1="302" y1="130" x2="302" y2="170"/>
<line class="d-line" x1="414" y1="130" x2="414" y2="170"/>
<rect class="d-box" x="252" y="170" width="100" height="34" rx="6"/>
<text class="d-t d-s" x="302" y="192" text-anchor="middle">RAM chip</text>
<rect class="d-box" x="364" y="170" width="100" height="34" rx="6"/>
<text class="d-t d-s" x="414" y="192" text-anchor="middle">storage chip</text>
<text class="d-m" x="358" y="226" text-anchor="middle">separate chips beside it</text>
</svg>
