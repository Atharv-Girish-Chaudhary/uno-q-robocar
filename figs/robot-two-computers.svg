<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 352" width="600" height="440" role="img" aria-label="Video goes from the camera over Wi-Fi to the Linux side, where your Python picks a move. Bridge carries the move to the microcontroller, which runs the wheels and stops them on time. The BOOT button reaches the microcontroller over I2C.">
<title>Video goes from the camera over Wi-Fi to the Linux side, where your Python picks a move. Bridge carries the move to the microcontroller, which runs the wheels and stops them on time. The BOOT button reaches the microcontroller over I2C.</title>
<style>
svg { color: #17211b; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
.bg { fill: #ffffff; }
.d-box { fill: #ffffff; stroke: #566a5d; stroke-width: 1.25; }
.d-yours { fill: #e2efe5; stroke: #23743f; stroke-width: 1.5; }
.d-theirs { fill: #e3ebf7; stroke: #1d55a0; stroke-width: 1.5; }
.d-stop { fill: #f7e8df; stroke: #ad4316; stroke-width: 1.75; }
.d-model { fill: #f5ebcd; stroke: #7d5900; stroke-width: 1.5; }
.d-frame { fill: none; stroke: #566a5d; stroke-width: 1.25; stroke-dasharray: 5 4; }
.d-dash { stroke-dasharray: 6 4; }
.d-line { stroke: currentColor; stroke-width: 1.5; fill: none; }
.d-t { fill: currentColor; font-size: 13px; }
.d-m { fill: #566a5d; font-size: 12px; }
.d-s { font-size: 12.5px; }
.d-b { font-weight: 700; }
.d-i { font-style: italic; }
.d-mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 11.5px; }
.d-xs { font-size: 11.5px; }
.d-red { fill: #ad4316; }
.r-hi { fill: #23743f; }
.r-lo { fill: #d3ddd5; }
.r-sep { stroke: #ffffff; stroke-width: 2; }
.r-on-hi { fill: #ffffff; font-size: 15px; font-weight: 700; }
.r-on-lo { fill: #17211b; font-size: 15px; font-weight: 700; }
.r-br-hi { fill: none; stroke: #23743f; stroke-width: 1.5; }
.r-br-lo { fill: none; stroke: #566a5d; stroke-width: 1.5; }
@media (prefers-color-scheme: dark) {
  svg { color: #e3eae5; }
  .bg { fill: #161e19; }
  .d-box { fill: #161e19; stroke: #9aac9f; }
  .d-yours { fill: #173022; stroke: #62c58a; }
  .d-theirs { fill: #16253b; stroke: #7eaaf0; }
  .d-stop { fill: #3a2015; stroke: #f0925f; }
  .d-model { fill: #322810; stroke: #e8bd57; }
  .d-frame { stroke: #9aac9f; }
  .d-m { fill: #9aac9f; }
  .d-red { fill: #f0925f; }
  .r-hi { fill: #62c58a; }
  .r-lo { fill: #2b372f; }
  .r-sep { stroke: #161e19; }
  .r-on-hi { fill: #0b120e; }
  .r-on-lo { fill: #e3eae5; }
  .r-br-hi { stroke: #62c58a; }
  .r-br-lo { stroke: #9aac9f; }
}
</style>
<rect class="bg" x="0" y="0" width="480" height="352" rx="12"/>
        <defs><marker id="m-robot" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs>
        <rect class="d-theirs" x="16" y="12" width="208" height="60" rx="8"/>
        <text class="d-t d-b" x="120" y="37" text-anchor="middle">ESP32-S3 camera</text>
        <text class="d-m" x="120" y="57" text-anchor="middle">own Wi-Fi, 320 by 240 video</text>
        <rect class="d-theirs" x="272" y="12" width="192" height="60" rx="8"/>
        <text class="d-t d-b" x="368" y="37" text-anchor="middle">BOOT button</text>
        <text class="d-m" x="368" y="57" text-anchor="middle">on the camera board</text>
        <rect class="d-frame" x="8" y="114" width="464" height="162" rx="12"/>
        <text class="d-m" x="20" y="268">Arduino UNO Q board</text>
        <rect class="d-yours" x="22" y="142" width="196" height="108" rx="8"/>
        <text class="d-t d-b" x="120" y="166" text-anchor="middle">Linux side</text>
        <text class="d-m" x="120" y="184" text-anchor="middle">Qualcomm chip</text>
        <text class="d-t" x="120" y="210" text-anchor="middle">your Python:</text>
        <text class="d-t" x="120" y="228" text-anchor="middle">find the ball, pick a move</text>
        <rect class="d-theirs" x="262" y="142" width="196" height="108" rx="8"/>
        <text class="d-t d-b" x="360" y="166" text-anchor="middle">Microcontroller</text>
        <text class="d-m" x="360" y="184" text-anchor="middle">STM32 chip</text>
        <text class="d-t" x="360" y="210" text-anchor="middle">Arduino sketch:</text>
        <text class="d-t" x="360" y="228" text-anchor="middle">run wheels, stop on time</text>
        <line class="d-line" x1="219" y1="200" x2="261" y2="200" marker-start="url(#m-robot)" marker-end="url(#m-robot)"/>
        <text class="d-m" x="240" y="192" text-anchor="middle">Bridge</text>
        <rect class="d-theirs" x="262" y="304" width="196" height="40" rx="8"/>
        <text class="d-t d-b" x="360" y="329" text-anchor="middle">4 mecanum wheels</text>
        <line class="d-line" x1="120" y1="72" x2="120" y2="142" marker-end="url(#m-robot)"/>
        <text class="d-m" x="128" y="100">video over Wi-Fi</text>
        <line class="d-line" x1="368" y1="72" x2="368" y2="142" marker-end="url(#m-robot)"/>
        <text class="d-m" x="360" y="100" text-anchor="end">start, stop (I2C)</text>
        <line class="d-line" x1="360" y1="250" x2="360" y2="304" marker-end="url(#m-robot)"/>
        <text class="d-m" x="368" y="294">power, then stop</text>
      </svg>
