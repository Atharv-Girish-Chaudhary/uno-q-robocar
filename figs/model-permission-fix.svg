<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 232" width="600" height="290" role="img" aria-label="On the laptop the model is -rwxr-xr-x. make flash zips and unzips it, and on the board it arrives as -rw-r--r--, without its x. Before the fix the runner refuses with a PermissionError and the app stops. After the fix the runner puts the x back, on the file or on a copy, and the model starts.">
<title>On the laptop the model is -rwxr-xr-x. make flash zips and unzips it, and on the board it arrives as -rw-r--r--, without its x. Before the fix the runner refuses with a PermissionError and the app stops. After the fix the runner puts the x back, on the file or on a copy, and the model starts.</title>
<style>
svg { color: #17211b; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
.bg { fill: #ffffff; }
.d-box { fill: #ffffff; stroke: #566a5d; stroke-width: 1.25; }
.d-yours { fill: #e2efe5; stroke: #23743f; stroke-width: 1.5; }
.d-theirs { fill: #e3ebf7; stroke: #1d55a0; stroke-width: 1.5; }
.d-stop { fill: #f7e8df; stroke: #ad4316; stroke-width: 1.75; }
.d-model { fill: #f5ebcd; stroke: #7d5900; stroke-width: 1.5; }
.d-frame { fill: none; stroke: #566a5d; stroke-width: 1.25; stroke-dasharray: 5 4; }
.d-dash { stroke-dasharray: 6 4; }
.d-line { stroke: currentColor; stroke-width: 1.5; fill: none; }
.d-t { fill: currentColor; font-size: 13px; }
.d-m { fill: #566a5d; font-size: 12px; }
.d-s { font-size: 12.5px; }
.d-b { font-weight: 700; }
.d-i { font-style: italic; }
.d-mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 11.5px; }
.d-xs { font-size: 11.5px; }
.d-red { fill: #ad4316; }
.r-hi { fill: #23743f; }
.r-lo { fill: #d3ddd5; }
.r-sep { stroke: #ffffff; stroke-width: 2; }
.r-on-hi { fill: #ffffff; font-size: 15px; font-weight: 700; }
.r-on-lo { fill: #17211b; font-size: 15px; font-weight: 700; }
.r-br-hi { fill: none; stroke: #23743f; stroke-width: 1.5; }
.r-br-lo { fill: none; stroke: #566a5d; stroke-width: 1.5; }
@media (prefers-color-scheme: dark) {
  svg { color: #e3eae5; }
  .bg { fill: #161e19; }
  .d-box { fill: #161e19; stroke: #9aac9f; }
  .d-yours { fill: #173022; stroke: #62c58a; }
  .d-theirs { fill: #16253b; stroke: #7eaaf0; }
  .d-stop { fill: #3a2015; stroke: #f0925f; }
  .d-model { fill: #322810; stroke: #e8bd57; }
  .d-frame { stroke: #9aac9f; }
  .d-m { fill: #9aac9f; }
  .d-red { fill: #f0925f; }
  .r-hi { fill: #62c58a; }
  .r-lo { fill: #2b372f; }
  .r-sep { stroke: #161e19; }
  .r-on-hi { fill: #0b120e; }
  .r-on-lo { fill: #e3eae5; }
  .r-br-hi { stroke: #62c58a; }
  .r-br-lo { stroke: #9aac9f; }
}
</style>
<rect class="bg" x="0" y="0" width="480" height="232" rx="12"/>
<defs><marker id="m-x" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs>
<rect class="d-model" x="16" y="12" width="140" height="52" rx="8"/>
<text class="d-t d-b" x="86" y="33" text-anchor="middle">On your laptop</text>
<text class="d-t d-mono" x="86" y="52" text-anchor="middle">-rwxr-xr-x</text>
<line class="d-line" x1="156" y1="38" x2="171" y2="38" marker-end="url(#m-x)"/>
<rect class="d-box" x="172" y="12" width="136" height="52" rx="8"/>
<text class="d-t d-b" x="240" y="33" text-anchor="middle">make flash</text>
<text class="d-m" x="240" y="52" text-anchor="middle">zip, then unzip</text>
<line class="d-line" x1="308" y1="38" x2="323" y2="38" marker-end="url(#m-x)"/>
<rect class="d-stop" x="324" y="12" width="140" height="52" rx="8"/>
<text class="d-t d-b" x="394" y="33" text-anchor="middle">On the board</text>
<text class="d-t d-mono" x="394" y="52" text-anchor="middle">-rw-r--r--</text>
<path class="d-line" d="M394 64 L394 88 L124 88 L124 107" marker-end="url(#m-x)"/>
<path class="d-line" d="M356 88 L356 107" marker-end="url(#m-x)"/>
<rect class="d-stop" x="16" y="108" width="216" height="48" rx="8"/>
<text class="d-t d-b" x="124" y="128" text-anchor="middle">Before: the runner refuses</text>
<text class="d-m" x="124" y="146" text-anchor="middle">PermissionError, app stops</text>
<rect class="d-yours" x="248" y="108" width="216" height="48" rx="8"/>
<text class="d-t d-b" x="356" y="128" text-anchor="middle">After: the x goes back</text>
<text class="d-m" x="356" y="146" text-anchor="middle">on the file, or on a copy</text>
<line class="d-line" x1="356" y1="156" x2="356" y2="171" marker-end="url(#m-x)"/>
<rect class="d-yours" x="248" y="172" width="216" height="48" rx="8"/>
<text class="d-t d-b" x="356" y="192" text-anchor="middle">The model starts</text>
<text class="d-t d-mono" x="356" y="210" text-anchor="middle">-rwxr-xr-x again</text>
</svg>
