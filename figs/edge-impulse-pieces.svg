<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 404" width="600" height="505" role="img" aria-label="Where each piece lives. Your phone takes pictures of the ball and goals. Your project on Edge Impulse's website holds the pictures with their boxes: that is the dataset. Edge Impulse's own computers do the training, which turns the dataset into a model. The model comes back as one .eim file, downloaded on your Mac. On the robot's board, model_runner.py runs that file on every camera picture. edge-impulse-linux would be a second runner for the same file, and is not needed.">
<title>Where each piece lives. Your phone takes pictures of the ball and goals. Your project on Edge Impulse's website holds the pictures with their boxes: that is the dataset. Edge Impulse's own computers do the training, which turns the dataset into a model. The model comes back as one .eim file, downloaded on your Mac. On the robot's board, model_runner.py runs that file on every camera picture. edge-impulse-linux would be a second runner for the same file, and is not needed.</title>
<style>
svg { color: #17211b; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
.bg { fill: #ffffff; }
.d-box { fill: #ffffff; stroke: #566a5d; stroke-width: 1.25; }
.d-yours { fill: #e2efe5; stroke: #23743f; stroke-width: 1.5; }
.d-theirs { fill: #e3ebf7; stroke: #1d55a0; stroke-width: 1.5; }
.d-stop { fill: #f7e8df; stroke: #ad4316; stroke-width: 1.75; }
.d-model { fill: #f5ebcd; stroke: #7d5900; stroke-width: 1.5; }
.d-frame { fill: none; stroke: #566a5d; stroke-width: 1.25; stroke-dasharray: 5 4; }
.d-dash { stroke-dasharray: 6 4; }
.d-line { stroke: currentColor; stroke-width: 1.5; fill: none; }
.d-t { fill: currentColor; font-size: 13px; }
.d-m { fill: #566a5d; font-size: 12px; }
.d-s { font-size: 12.5px; }
.d-b { font-weight: 700; }
.d-i { font-style: italic; }
.d-mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 11.5px; }
.d-xs { font-size: 11.5px; }
.d-red { fill: #ad4316; }
.r-hi { fill: #23743f; }
.r-lo { fill: #d3ddd5; }
.r-sep { stroke: #ffffff; stroke-width: 2; }
.r-on-hi { fill: #ffffff; font-size: 15px; font-weight: 700; }
.r-on-lo { fill: #17211b; font-size: 15px; font-weight: 700; }
.r-br-hi { fill: none; stroke: #23743f; stroke-width: 1.5; }
.r-br-lo { fill: none; stroke: #566a5d; stroke-width: 1.5; }
@media (prefers-color-scheme: dark) {
  svg { color: #e3eae5; }
  .bg { fill: #161e19; }
  .d-box { fill: #161e19; stroke: #9aac9f; }
  .d-yours { fill: #173022; stroke: #62c58a; }
  .d-theirs { fill: #16253b; stroke: #7eaaf0; }
  .d-stop { fill: #3a2015; stroke: #f0925f; }
  .d-model { fill: #322810; stroke: #e8bd57; }
  .d-frame { stroke: #9aac9f; }
  .d-m { fill: #9aac9f; }
  .d-red { fill: #f0925f; }
  .r-hi { fill: #62c58a; }
  .r-lo { fill: #2b372f; }
  .r-sep { stroke: #161e19; }
  .r-on-hi { fill: #0b120e; }
  .r-on-lo { fill: #e3eae5; }
  .r-br-hi { stroke: #62c58a; }
  .r-br-lo { stroke: #9aac9f; }
}
</style>
<rect class="bg" x="0" y="0" width="480" height="404" rx="12"/>
<defs><marker id="m-ei" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs>
<rect class="d-box" x="60" y="12" width="360" height="52" rx="8"/>
<text class="d-t d-b" x="240" y="34" text-anchor="middle">Your phone</text>
<text class="d-m" x="240" y="53" text-anchor="middle">takes pictures of the ball and goals</text>
<line class="d-line" x1="240" y1="64" x2="240" y2="85" marker-end="url(#m-ei)"/>
<rect class="d-theirs" x="60" y="86" width="360" height="52" rx="8"/>
<text class="d-t d-b" x="240" y="108" text-anchor="middle">Edge Impulse's website: your project</text>
<text class="d-m" x="240" y="127" text-anchor="middle">the pictures with their boxes: the dataset</text>
<line class="d-line" x1="240" y1="138" x2="240" y2="159" marker-end="url(#m-ei)"/>
<rect class="d-theirs" x="60" y="160" width="360" height="52" rx="8"/>
<text class="d-t d-b" x="240" y="182" text-anchor="middle">Edge Impulse's computers</text>
<text class="d-m" x="240" y="201" text-anchor="middle">training turns the dataset into a model</text>
<line class="d-line" x1="240" y1="212" x2="240" y2="233" marker-end="url(#m-ei)"/>
<rect class="d-model" x="60" y="234" width="360" height="52" rx="8"/>
<text class="d-t d-b" x="240" y="256" text-anchor="middle">The .eim file</text>
<text class="d-m" x="240" y="275" text-anchor="middle">the trained model, downloaded on your Mac</text>
<line class="d-line" x1="240" y1="286" x2="240" y2="307" marker-end="url(#m-ei)"/>
<rect class="d-yours" x="60" y="308" width="360" height="52" rx="8"/>
<text class="d-t d-b" x="240" y="330" text-anchor="middle">The robot's board</text>
<text class="d-m" x="240" y="349" text-anchor="middle">model_runner.py runs it on every picture</text>
<text class="d-m" x="240" y="384" text-anchor="middle">edge-impulse-linux would be a second runner</text>
<text class="d-m" x="240" y="402" text-anchor="middle">for the same file: not needed</text>
</svg>
